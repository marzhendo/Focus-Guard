<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusGuard Dashboard</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Tailwind Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'focus-green': '#39FF14',
            'alert-red': '#EF4444',
            'bg-deep': '#020617',
            'surface-dark': '#12161D',
          },
          fontFamily: {
            'body': ['Inter', 'sans-serif'],
            'display': ['Space Grotesk', 'sans-serif'],
            'mono': ['JetBrains Mono', 'monospace'],
          },
          boxShadow: {
            'neon-glow': '0 0 20px rgba(57, 255, 20, 0.4)',
            'neon-glow-strong': '0 0 40px rgba(57, 255, 20, 0.6)',
            'glass': '0 4px 30px rgba(0, 0, 0, 0.1)',
          }
        }
      }
    }
  </script>

  <!-- Custom CSS for Components -->
  <style type="text/tailwindcss">
    @layer utilities {
      .glass-panel {
        @apply bg-surface-dark/60 backdrop-blur-xl border border-white/10 shadow-glass rounded-lg;
      }
      .btn-primary {
        @apply bg-focus-green text-black font-mono font-bold px-6 py-3 rounded text-sm tracking-widest uppercase transition-all hover:shadow-neon-glow hover:bg-white;
      }
      .btn-secondary {
        @apply bg-transparent border border-white/20 text-white font-mono font-bold px-6 py-3 rounded text-sm tracking-widest uppercase transition-all hover:border-white/50 hover:bg-white/5;
      }
      .btn-danger {
        @apply bg-transparent border border-alert-red/50 text-alert-red font-mono font-bold px-6 py-3 rounded text-sm tracking-widest uppercase transition-all hover:bg-alert-red/10 hover:border-alert-red hover:shadow-[0_0_15px_rgba(239,68,68,0.4)];
      }
      .text-glow {
        text-shadow: 0 0 15px rgba(57, 255, 20, 0.6), 0 0 30px rgba(57, 255, 20, 0.3);
      }
    }

    /* Custom Animations */
    @keyframes slideDown {
      0% { top: -10px; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { top: 100%; opacity: 0; }
    }
    .animate-scan {
      animation: slideDown 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-bg-deep text-white font-body h-screen w-screen overflow-hidden flex selection:bg-focus-green selection:text-black">

  <!-- Sidebar -->
  <aside class="w-64 glass-panel border-y-0 border-l-0 rounded-none border-r border-white/5 flex flex-col z-10 relative">
    <!-- Brand Logo -->
    <div class="p-6 border-b border-white/5">
      <h1 class="font-display font-bold text-2xl tracking-tighter flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-focus-green shadow-[0_0_8px_#39FF14]"></div>
        FocusGuard
      </h1>
    </div>
    
    <!-- Navigation -->
    <nav class="flex-1 p-4 space-y-2">
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-md bg-white/5 text-focus-green font-medium transition-colors hover:bg-white/10">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        Dashboard
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-md text-white/50 hover:text-white hover:bg-white/5 transition-colors font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
        Analytics
      </a>
      <a href="#" class="flex items-center gap-3 px-4 py-3 rounded-md text-white/50 hover:text-white hover:bg-white/5 transition-colors font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
        Settings
      </a>
    </nav>
    
    <!-- User Profile Snippet -->
    <div class="p-6 border-t border-white/5">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-surface-dark border border-white/10 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white/50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        </div>
        <div>
          <p class="text-sm font-medium">Power User</p>
          <p class="text-xs text-white/40 font-mono mt-0.5">ID: FG-1337</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Dashboard Area -->
  <main class="flex-1 relative flex flex-col z-0">
    
    <!-- Ambient Background Glow (Subtle) -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-focus-green/5 rounded-full blur-[120px] pointer-events-none"></div>

    <!-- Header Section -->
    <header class="p-8 flex justify-between items-center z-10">
      <div>
        <h2 class="font-display text-3xl font-bold text-white tracking-tight">Focus Session</h2>
        <p class="text-white/50 font-mono text-xs mt-2 uppercase tracking-widest">System Armed & Monitoring</p>
      </div>
      <div class="glass-panel px-5 py-2.5 flex items-center gap-3 border-focus-green/20">
        <div class="w-2 h-2 rounded-full bg-focus-green animate-pulse shadow-[0_0_8px_#39FF14]"></div>
        <span class="font-mono text-xs text-focus-green uppercase tracking-[0.2em] font-bold">AI Active</span>
      </div>
    </header>

    <!-- Center Timer Area -->
    <div class="flex-1 flex flex-col items-center justify-center z-10 -mt-16">
      
      <!-- Giant Timer Display -->
      <div class="relative mb-14 group">
        <!-- The "Focus Pulse" Rings -->
        <div class="absolute inset-0 rounded-full border border-focus-green/30 scale-[1.15] animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite] opacity-50"></div>
        <div class="absolute inset-0 rounded-full border border-focus-green/20 scale-[1.3] animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite_1s] opacity-30"></div>
        
        <div class="text-[14rem] font-mono font-bold leading-none text-focus-green text-glow tabular-nums tracking-tighter cursor-default">
          25:00
        </div>
      </div>

      <!-- Control Buttons -->
      <div class="flex items-center gap-6">
        <button class="btn-secondary">Pause</button>
        <button class="btn-primary">Start Focus</button>
        <button class="btn-danger">Abort</button>
      </div>
    </div>

    <!-- Bottom Right Webcam Placeholder -->
    <div class="absolute bottom-8 right-8 z-20">
      <div class="glass-panel w-80 h-48 overflow-hidden relative group">
        <!-- Overlay borders for depth -->
        <div class="absolute inset-0 border border-white/10 rounded-lg z-10 pointer-events-none"></div>
        <div class="absolute inset-x-0 top-0 h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent z-10"></div>
        
        <!-- Placeholder content -->
        <div class="w-full h-full bg-surface-dark/90 flex flex-col items-center justify-center text-white/30 relative">
          
          <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 mb-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
          <span class="font-mono text-xs uppercase tracking-widest font-bold">Webcam Feed</span>
          <span class="font-mono text-[10px] mt-1.5 text-focus-green/60 uppercase tracking-wider">Awaiting Signal...</span>
          
          <!-- Cyber Scanning Line Effect -->
          <div class="absolute top-0 left-0 w-full h-[2px] bg-focus-green/40 shadow-[0_0_10px_rgba(57,255,20,0.6)] animate-scan"></div>
        </div>
      </div>
    </div>
  </main>

</body>
</html>
